<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boli Fest · Bolis Gourmet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD600;--b:#39B5FF;--p:#F86496;--g:#8BE082;--c:#5CE1E6;--ink:#111;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--b) 0 25%,var(--y) 25% 50%,var(--p) 50% 75%,var(--g) 75%) fixed;min-height:100vh;padding:18px 12px 30px}
.card{max-width:520px;margin:0 auto;background:#fff;border-radius:22px;padding:20px 16px 24px;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center}
.logo{width:130px;height:130px;border:5px solid var(--y);border-radius:50%;background:#fff;object-fit:cover}
h1{font-size:2.3rem;line-height:1;margin:10px 0 2px;text-shadow:3px 3px 0 var(--y);font-weight:700}
h2{font-size:1.25rem;margin:20px 0 10px;font-weight:700}
.price{display:inline-block;background:#FFE96B;border-radius:50px;padding:4px 16px;font-size:1.5rem;font-weight:700;margin:4px 0 12px}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{border-radius:14px;padding:12px;font-size:1.25rem;font-weight:700;text-transform:uppercase}
.chip:nth-child(odd){background:var(--g)}.chip:nth-child(even){background:var(--p)}
.water{background:var(--c);border-radius:16px;padding:12px;margin-top:8px}
.water .chip{background:#fff!important;font-size:1.05rem;margin-top:8px}
.empty{padding:14px;color:#555}
.venta{font-size:1.7rem;font-weight:700;margin-top:22px;text-shadow:3px 3px 0 var(--b)}
.upd{font-size:.8rem;color:#666;margin-top:6px}
#admin{max-width:520px;margin:0 auto 14px;background:#fff;border:4px dashed var(--c);border-radius:18px;padding:14px}
#admin h3{margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{display:flex;gap:8px;align-items:center;background:#f4f4f4;border-radius:10px;padding:10px;font-weight:500;font-size:.95rem}
.grid label.on{background:var(--g)}
input[type=checkbox]{width:20px;height:20px}
input[type=text],input[type=number]{width:100%;padding:10px;border:2px solid #ccc;border-radius:10px;font:inherit;margin-top:6px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--p);color:#fff;margin-top:10px;cursor:pointer}
button.alt{background:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap}
canvas{max-width:100%;height:auto;margin-top:10px;border:3px solid var(--y);border-radius:10px}
.msg{font-size:.85rem;color:#444;margin-top:12px}
.hid{display:none}
</style></head>

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const m=S.milk.filter(x=>ALL.includes(x));

}

    T('Sabores a base de agua  $'+S.pw,y+62,42);let yy=y+90;
    w.forEach(t=>{x.fillStyle='#fff';x.beginPath();x.roundRect(130,yy,W-260,80,20);x.fill();T(t.toUpperCase(),yy+55,38);yy+=96});y+=h+30}
  T('¡De venta aquí!',H-110,64,'sh');
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function shareBlob(b,name,title){
  const f=new File([b],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function drawQR(url){
  const q=qrcode(0,'H');q.addData(url);q.make();
  const n=q.getModuleCount(),s=Math.floor(900/(n+8)),W=s*(n+8),cv=$('qr');cv.width=cv.height=W;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,W);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+4)*s,(r+4)*s,s,s);
  const L=W*.2,img=new Image();img.onload=()=>{x.fillStyle='#fff';x.beginPath();x.arc(W/2,W/2,L/2+8,0,7);x.fill();x.save();x.beginPath();x.arc(W/2,W/2,L/2,0,7);x.clip();x.drawImage(img,W/2-L/2,W/2-L/2,L,L);x.restore()};img.src=LOGO;
}
function readForm(){
  S.milk=[...document.querySelectorAll('#g input:checked')].map(i=>i.value);
  S.water=$('w').value.split(',').map(t=>t.trim()).filter(Boolean);
  S.pm=+$('pm').value||0;S.pw=+$('pw').value||0;S.url=$('u').value.trim();
  S.updated=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
}
function update(){
  readForm();LS.set(S);render();
  const ok=/^https?:\/\//.test(S.url);$('qr').classList.toggle('hid',!ok);$('dlq').classList.toggle('hid',!ok);
  if(ok){drawQR(S.url.split('#')[0]+'#m='+enc(S))}
}
function editor(){
  const a=$('admin');a.classList.remove('hid');
  const guess=/^https?:/.test(location.href)?location.href.split('#')[0]:'';
  if(!S.url)S.url=guess;
  a.innerHTML=`<h3>🛠 Mis bolis de hoy</h3><div class="grid" id="g">${ALL.map(f=>`<label class="${S.milk.includes(f)?'on':''}"><input type="checkbox" value="${esc(f)}" ${S.milk.includes(f)?'checked':''}>${esc(f)}</label>`).join('')}</div>
  <div class="msg">Sabores de agua (separados por coma):</div><input type="text" id="w" value="${esc(S.water.join(', '))}" placeholder="Mango, Limón, Tamarindo">
  <div class="row" style="margin-top:12px"><label style="flex:1" class="msg" style="margin:0">Precio leche $<input type="number" id="pm" value="${S.pm}" min="0"></label><label style="flex:1" class="msg">Precio agua $<input type="number" id="pw" value="${S.pw}" min="0"></label></div>
  <div class="row"><button id="sh">📲 Compartir imagen</button></div>
  <div class="msg">Para el QR, pega el enlace donde publicaste esta página:</div><input type="text" id="u" value="${esc(S.url)}" placeholder="https://tupagina.netlify.app">
  <canvas id="qr" class="hid" width="10" height="10"></canvas><div class="row"><button class="alt hid" id="dlq">⬇ Descargar QR</button></div>`;
  a.oninput=a.onchange=e=>{if(e.target.type==='checkbox')e.target.parentElement.classList.toggle('on',e.target.checked);update()};
  $('sh').onclick=async()=>{readForm();shareBlob(await menuBlob(),'Bolis_BoliFest.png','Bolis Gourmet')};
  $('dlq').onclick=()=>$('qr').toBlob(b=>shareBlob(b,'QR_BoliFest.png','QR Boli Fest'));
  update();
}
if(location.hash.startsWith('#m=')){try{S=dec(location.hash.slice(3));render()}catch(e){$('app').textContent='Enlace no válido'}}else editor();
</script></body></html>
